[package]
name = "tmplr"
version = "0.1.1"
edition = "2024"
authors = ["Przemyslaw Alexander Kaminski <xlii@users.noreply.github.com>"]
description = "Zero-friction project scaffolding for your terminal"
repository = "https://github.com/exlee/tmplr"
license = "MIT"
readme = "README.md"
keywords = ["template", "scaffolding", "cli", "project-generator"]
categories = ["command-line-utilities", "development-tools", "template-engine"]
rust-version = "1.91.0"

# Optimize dependencies even in debug mode
[profile.dev.package."*"]
opt-level = 3

# Disable debug info for dependencies (massive size/time win)
[profile.dev]
#debug = 0  # or 1 for line tables only
#strip = "debuginfo"

[profile.release]
debug = 0
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
dialoguer = { version = "0.12.0", features = ["fuzzy-select"], default-features = false }
pathdiff = "0.2.3"
pico-args = { version = "0.5.0", features = ["eq-separator", "short-space-opt"] }

[[bin]]
name = "tmplr"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2.1.1"
assert_fs = "1.1.3"
predicates = "3.1.3"
